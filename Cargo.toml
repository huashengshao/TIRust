[workspace]
resolver = "3"
exclude = ["dependencies/linnest"]
members = ["crates/iregi-rust", "crates/iregi-masters", "crates/iregi-prepare", "crates/iregi-cli", "crates/iregi-python", "dependencies/feynkit-integrals"]
# Routine Rust builds keep the optional Python host and rendering closure out.
default-members = ["crates/iregi-rust", "crates/iregi-masters", "crates/iregi-prepare", "crates/iregi-cli", "dependencies/feynkit-integrals"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
authors = ["huashengshao <erdissshaw@gmail.com>"]
license = "0BSD"
repository = "https://github.com/huashengshao/TIRust"

[workspace.dependencies]
symbolica = { version = "3.0", default-features = false, features = ["integer-gmp", "float-mpfr", "native_code_generation", "bincode", "serde"] }
oneloop = { git = "https://github.com/alphal00p/oneloopmaster.git", rev = "2e7afabb5903814196d7ab39c695ed9cac777aa4", default-features = false, features = ["generated-evaluators", "rust-codegen"] }
feynkit-graph = { git = "https://github.com/ValentinHirschi/gammaloop", rev = "6ef9ab3a426844c89cd2c15962ce4a274bb2e43c" }
feynkit-model = { git = "https://github.com/ValentinHirschi/gammaloop", rev = "6ef9ab3a426844c89cd2c15962ce4a274bb2e43c", features = ["native"] }
feynkit-generator = { git = "https://github.com/ValentinHirschi/gammaloop", rev = "6ef9ab3a426844c89cd2c15962ce4a274bb2e43c" }
spenso = { git = "https://github.com/ValentinHirschi/gammaloop", rev = "6ef9ab3a426844c89cd2c15962ce4a274bb2e43c", default-features = false }
spenso-hep-lib = { git = "https://github.com/ValentinHirschi/gammaloop", rev = "6ef9ab3a426844c89cd2c15962ce4a274bb2e43c", default-features = false }
idenso = { git = "https://github.com/ValentinHirschi/gammaloop", rev = "6ef9ab3a426844c89cd2c15962ce4a274bb2e43c", default-features = false }
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["arbitrary_precision"] }
clap = { version = "4", features = ["derive"] }
iregi-masters = { path = "crates/iregi-masters" }
iregi-rust = { path = "crates/iregi-rust" }
iregi-prepare = { path = "crates/iregi-prepare" }

[patch.crates-io]
# Symbolica: symbolica-dev/symbolica `community` 0e2ad04c, the one revision shared with
# pyAmpliCol, NinjaRS and oneloopmaster. Crates require symbolica = "3.0" so that an
# embedding workspace's own patch decides the revision.
# Needed Symbolica changes go upstream, never into a vendored or modified copy here.
symbolica = { git = "https://github.com/symbolica-dev/symbolica.git", rev = "0e2ad04c4f281e28bd29d5ad8b1bebf2764379b7" }
numerica = { git = "https://github.com/symbolica-dev/symbolica.git", rev = "0e2ad04c4f281e28bd29d5ad8b1bebf2764379b7" }
graphica = { git = "https://github.com/symbolica-dev/symbolica.git", rev = "0e2ad04c4f281e28bd29d5ad8b1bebf2764379b7" }
symbolica-typst-plugin = { git = "https://github.com/symbolica-dev/symbolica-typst-plugin", rev = "57b7455b37c30f4f87353c0073e49f5225e937ab" }

[profile.release]
lto = "thin"
codegen-units = 1

[profile.dev.package."*"]
opt-level = 2

# Fast incremental optimized builds for development iteration only.
[profile.devopt]
inherits = "release"
lto = false
codegen-units = 16
incremental = true

[profile.bench]
inherits = "release"
debug = true

# Native SVG layout must keep numeric CBOR typed under exact JSON feature unification.
[patch."https://github.com/ValentinHirschi/gammaloop"]
linnest = { path = "dependencies/linnest" }
